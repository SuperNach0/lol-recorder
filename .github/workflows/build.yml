name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: LoL-Recorder-Setup
          path: release/*.exe

      - name: Read version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Every push to main refreshes the installer on the release for the current version.
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LoL Recorder ${{ steps.version.outputs.version }}
          prerelease: true
          files: release/*.exe
